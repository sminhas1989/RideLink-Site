<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RideLink — Coming Soon</title>
<meta name="description" content="RideLink is the all-in-one motorcycle app — live rider tracking, group rides, crash detection, and more. Coming soon." />
<meta property="og:title" content="RideLink — Coming Soon" />
<meta property="og:description" content="Live rider tracking, group rides, crash detection, and more." />
<meta property="og:image" content="https://ride-link.app/images/og-image.png" />
<meta property="og:image:width" content="1024" />
<meta property="og:image:height" content="1024" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:image" content="https://ride-link.app/images/og-image.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .wrap {
    text-align: center;
    width: 100%;
    max-width: 420px;
  }

  .wordmark {
    width: 100%;
    max-width: 420px;
    height: auto;
    display: block;
    margin: 0 auto 28px;
  }

  .coming-soon {
    font-family: 'Rajdhani', -apple-system, sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #8cff00;
    margin: 0 0 32px;
  }

  .waitlist {
    display: flex;
    gap: 10px;
  }

  @media (max-width: 480px) {
    .waitlist { flex-direction: column; }
  }

  .waitlist input {
    flex: 1;
    min-width: 0;
    padding: 13px 18px;
    border-radius: 999px;
    border: 1px solid #2a2a2a;
    background: #151515;
    color: #f5f6f8;
    font-size: 14px;
  }
  .waitlist input::placeholder { color: #8a8f99; }
  .waitlist input:focus { outline: none; border-color: #8cff00; }

  .waitlist button {
    padding: 10px 18px;
    border-radius: 999px;
    border: none;
    background: #8cff00;
    color: #0a0a0a;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .waitlist button:disabled { opacity: 0.6; cursor: default; }

  .waitlist-status {
    margin-top: 14px;
    font-size: 13px;
    min-height: 16px;
  }
  .waitlist-status.success { color: #8cff00; }
  .waitlist-status.error { color: #ff6b6b; }
</style>
</head>
<body>
  <div class="wrap">
    <img class="wordmark" src="images/wordmark.png" alt="RideLink" />
    <p class="coming-soon">Coming Soon</p>

    <form class="waitlist" id="waitlistForm">
      <input type="email" id="waitlistEmail" placeholder="Enter your email for early access" required autocomplete="email" />
      <button type="submit" id="waitlistButton">Get Early Access</button>
    </form>
    <div class="waitlist-status" id="waitlistStatus"></div>
  </div>

  <script>
    // Writes to Supabase, public anon key — insert-only, see
    // supabase/migrations/20261023160000_waitlist_signups.sql.
    const SUPABASE_URL = 'https://pzlchlsioqetkaebynoo.supabase.co';
    const ANON_KEY = 'sb_publishable_jM9S9mIfIkSYYx5sJSXNDQ_-4TX8Hgh';

    async function joinWaitlist(email, statusEl, buttonEl) {
      buttonEl.disabled = true;
      statusEl.className = 'waitlist-status';
      statusEl.textContent = 'Joining…';
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/waitlist_signups`, {
          method: 'POST',
          headers: {
            apikey: ANON_KEY,
            Authorization: `Bearer ${ANON_KEY}`,
            'Content-Type': 'application/json',
            Prefer: 'return=minimal',
          },
          body: JSON.stringify({ email: email.trim().toLowerCase() }),
        });
        if (response.status === 201) {
          statusEl.className = 'waitlist-status success';
          statusEl.textContent = "You're on the list! We'll email you when RideLink launches.";
          return true;
        }
        if (response.status === 409) {
          statusEl.className = 'waitlist-status success';
          statusEl.textContent = "You're already on the list — we'll be in touch.";
          return true;
        }
        statusEl.className = 'waitlist-status error';
        statusEl.textContent = 'Please enter a valid email address.';
        return false;
      } catch {
        statusEl.className = 'waitlist-status error';
        statusEl.textContent = 'Something went wrong. Please try again.';
        return false;
      } finally {
        buttonEl.disabled = false;
      }
    }

    document.getElementById('waitlistForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const emailEl = document.getElementById('waitlistEmail');
      const statusEl = document.getElementById('waitlistStatus');
      const buttonEl = document.getElementById('waitlistButton');
      const ok = await joinWaitlist(emailEl.value, statusEl, buttonEl);
      if (ok) emailEl.value = '';
    });
  </script>
</body>
</html>
