<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<script>
  // Smart download redirect (e.g. for a QR code pointing here): sends
  // an iOS visitor straight to the App Store and an Android visitor
  // straight to Google Play, no manual button tap. location.replace
  // (not href) so this redirect page never sits in back-button
  // history. Desktop/unknown UAs fall through untouched and just see
  // the normal page below with both store buttons.
  (function () {
    var ua = navigator.userAgent || navigator.vendor || '';
    var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    var isAndroid = /Android/.test(ua);
    if (isIOS) {
      location.replace('https://apps.apple.com/app/id6825378676');
    } else if (isAndroid) {
      location.replace('https://play.google.com/store/apps/details?id=com.sminhas89.RideLink');
    }
  })();
</script>
<title>RideLink — Download Now</title>
<meta name="description" content="RideLink is the all-in-one motorcycle app — live rider tracking, group rides, crash detection, and more. Download now on iOS and Android." />
<meta property="og:title" content="RideLink — Download Now" />
<meta property="og:description" content="Live rider tracking, group rides, crash detection, and more. Download now on iOS and Android." />
<meta property="og:image" content="https://ride-link.app/images/og-image.png" />
<meta property="og:image:width" content="1024" />
<meta property="og:image:height" content="1024" />
<meta property="og:type" content="website" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:image" content="https://ride-link.app/images/og-image.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: #0a0a0a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .wrap {
    text-align: center;
    width: 100%;
    max-width: 420px;
  }

  .wordmark {
    width: 100%;
    max-width: 420px;
    height: auto;
    display: block;
    margin: 0 auto 28px;
  }

  .tagline {
    font-family: 'Rajdhani', -apple-system, sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #8cff00;
    margin: 0 0 32px;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .store-btn {
    display: block;
    text-decoration: none;
    border-radius: 12px;
    padding: 14px 18px;
    font-size: 15px;
    font-weight: 600;
  }

  .store-btn.ios {
    background: #f5f6f8;
    color: #0a0a0a;
  }

  .store-btn.android {
    background: transparent;
    border: 1px solid #2a2a2a;
    color: #f5f6f8;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img class="wordmark" src="images/wordmark.png" alt="RideLink" />
    <p class="tagline">Ride Safe · Ride Together · Ride Connected</p>

    <div class="buttons">
      <a class="store-btn ios" href="https://apps.apple.com/app/id6825378676">Download on the App Store</a>
      <a class="store-btn android" href="https://play.google.com/store/apps/details?id=com.sminhas89.RideLink">Get it on Google Play</a>
    </div>
  </div>
</body>
</html>
